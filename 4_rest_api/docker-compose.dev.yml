services:
  db:
    image: postgres:15-alpine
    container_name: school_db_dev
    environment:
      POSTGRES_DB: school_db_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: school_api_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://dev_user:dev_password@db:5432/school_db_dev
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: school_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - api

volumes:
  dev_postgres_data:
  static_volume: